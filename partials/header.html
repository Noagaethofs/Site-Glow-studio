<script>
  /* Intro : décidée avant le premier affichage pour éviter tout flash.
     Une fois par session, jamais en reduced-motion, retirée de force après 2,5 s. */
  (function () {
    try {
      if (sessionStorage.getItem('glow-intro') || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      sessionStorage.setItem('glow-intro', '1');
      var d = document.documentElement;
      d.classList.add('is-loading');
      setTimeout(function () { d.classList.remove('is-loading'); }, 2500);
    } catch (e) {}
  })();
</script>
